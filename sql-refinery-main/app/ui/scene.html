<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Refinery 3D Hero Scene</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0B0B0D;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }
    #scene-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Soft vignette overlay */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(11, 11, 13, 0.85) 100%);
      box-shadow: inset 0 0 100px rgba(11, 11, 13, 0.95);
    }

    /* Floating Interactive State Badges */
    .state-controller {
      position: absolute;
      bottom: 14px;
      right: 18px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 19, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .state-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #8C96AB;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .state-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.05);
    }

    .state-btn.active {
      color: #FFFFFF;
      background: rgba(255, 122, 47, 0.16);
      border-color: rgba(255, 122, 47, 0.5);
      box-shadow: 0 0 10px rgba(255, 122, 47, 0.25);
    }

    .state-btn.active.done-btn {
      background: rgba(61, 255, 138, 0.16);
      border-color: rgba(61, 255, 138, 0.5);
      box-shadow: 0 0 10px rgba(61, 255, 138, 0.25);
    }

    .state-indicator-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Floating Machine Hologram HUD */
    .machine-hud {
      position: absolute;
      top: 14px;
      right: 18px;
      z-index: 20;
      background: rgba(16, 19, 26, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 14px;
      color: #FFFFFF;
      font-size: 11px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 170px;
    }

    .hud-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #9BA3B8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud-status-text {
      color: #FF7A2F;
      font-weight: 700;
    }

    .hud-progress-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;
    }

    .hud-progress-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #FF7A2F, #3DFF8A);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 8px rgba(255, 122, 47, 0.5);
    }

    /* Fallback static illustration for low-power or WebGL-disabled */
    #fallback-container {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: #8C96AB;
      font-size: 13px;
    }
  </style>
  <!-- Load Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="scene-container">
    <div class="vignette-overlay"></div>

    <!-- Floating HUD -->
    <div class="machine-hud" id="machine-hud">
      <div class="hud-title-row">
        <span>NEMOTRON REFINERY</span>
        <span class="hud-status-text" id="hud-status">IDLE</span>
      </div>
      <div class="hud-progress-bg">
        <div class="hud-progress-fill" id="hud-progress"></div>
      </div>
    </div>

    <!-- Interactive Mode Pill Selector -->
    <div class="state-controller">
      <button class="state-btn active" id="btn-idle" onclick="setRefineryState('idle')">
        <span class="state-indicator-dot"></span>Idle
      </button>
      <button class="state-btn" id="btn-processing" onclick="setRefineryState('processing')">
        <span class="state-indicator-dot"></span>Refining
      </button>
      <button class="state-btn done-btn" id="btn-done" onclick="setRefineryState('done')">
        <span class="state-indicator-dot"></span>Complete
      </button>
    </div>

    <div id="fallback-container">
      <p>✦ Nemotron SQL Refinery (3D Scene Loaded)</p>
    </div>
  </div>

  <script>
    // Initial State injected from Python template: {{INITIAL_STATE}}
    let currentState = '{{INITIAL_STATE}}' || 'idle';
    if (!['idle', 'processing', 'refining', 'done'].includes(currentState)) {
      currentState = 'idle';
    }
    if (currentState === 'refining') currentState = 'processing';

    // Respect reduced motion
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Check WebGL support
    function isWebGLAvailable() {
      try {
        const canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (e) {
        return false;
      }
    }

    if (!isWebGLAvailable()) {
      document.getElementById('fallback-container').style.display = 'flex';
      document.getElementById('machine-hud').style.display = 'none';
    } else {
      initScene();
    }

    let scene, camera, renderer;
    let coreLight, scanPadLight, machineCore, coolingRing1, coolingRing2;
    let rawBlocks = [], optimizedBlocks = [];
    let completeBadgeMesh;
    let particlesMesh;
    let targetCameraX = 18, targetCameraY = 14, targetCameraZ = 18;
    let mouseX = 0, mouseY = 0;
    let speedFactor = 1.0;
    let progressTarget = 20;
    let currentProgress = 20;

    function initScene() {
      const container = document.getElementById('scene-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      // 1. Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0B0B0D);
      scene.fog = new THREE.FogExp2(0x0B0B0D, 0.025);

      // 2. Camera setup (Isometric perspective projection)
      camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 100);
      camera.position.set(18, 14, 18);
      camera.lookAt(0, 1.2, 0);

      // 3. Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Lighting
      const ambientLight = new THREE.AmbientLight(0x1a2130, 0.95);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xdce7ff, 1.3);
      dirLight.position.set(15, 25, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 50;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      // Glowing internal core light (Orange / Amber)
      coreLight = new THREE.PointLight(0xFF7A2F, 3.5, 14);
      coreLight.position.set(0, 1.6, 0);
      scene.add(coreLight);

      // Output scan pad light (Emerald Green)
      scanPadLight = new THREE.PointLight(0x3DFF8A, 0.2, 8);
      scanPadLight.position.set(6.2, 1.4, 0);
      scene.add(scanPadLight);

      // 5. Grid floor (Subtle dark metal grid)
      const grid = new THREE.GridHelper(30, 30, 0x242d3d, 0x121620);
      grid.position.y = -0.02;
      scene.add(grid);

      // 6. Materials
      const darkMetalMat = new THREE.MeshStandardMaterial({
        color: 0x141822,
        metalness: 0.85,
        roughness: 0.25
      });

      const beltMat = new THREE.MeshStandardMaterial({
        color: 0x0E1117,
        roughness: 0.8
      });

      const glassMat = new THREE.MeshPhysicalMaterial ? 
        new THREE.MeshPhysicalMaterial({
          color: 0x50657e,
          transparent: true,
          opacity: 0.38,
          roughness: 0.1,
          metalness: 0.1,
          transmission: 0.6,
          ior: 1.4
        }) : 
        new THREE.MeshStandardMaterial({
          color: 0x50657e,
          transparent: true,
          opacity: 0.45,
          roughness: 0.15
        });

      // 7. Center Machine
      const machineGroup = new THREE.Group();

      // Main base chassis
      const baseGeo = new THREE.BoxGeometry(4.2, 0.8, 3.4);
      const baseMesh = new THREE.Mesh(baseGeo, darkMetalMat);
      baseMesh.position.y = 0.4;
      baseMesh.castShadow = true;
      baseMesh.receiveShadow = true;
      machineGroup.add(baseMesh);

      // Machine roof
      const roofGeo = new THREE.BoxGeometry(4.2, 0.5, 3.4);
      const roofMesh = new THREE.Mesh(roofGeo, darkMetalMat);
      roofMesh.position.y = 2.8;
      roofMesh.castShadow = true;
      machineGroup.add(roofMesh);

      // Corner pillars
      const pillarGeo = new THREE.BoxGeometry(0.35, 1.9, 0.35);
      [
        [-1.9, 1.6, -1.5],
        [1.9, 1.6, -1.5],
        [-1.9, 1.6, 1.5],
        [1.9, 1.6, 1.5]
      ].forEach(pos => {
        const pillar = new THREE.Mesh(pillarGeo, darkMetalMat);
        pillar.position.set(...pos);
        pillar.castShadow = true;
        machineGroup.add(pillar);
      });

      // Glass panels (front & back)
      const glassGeo = new THREE.BoxGeometry(3.6, 1.8, 0.08);
      const glassFront = new THREE.Mesh(glassGeo, glassMat);
      glassFront.position.set(0, 1.6, 1.55);
      machineGroup.add(glassFront);

      const glassBack = new THREE.Mesh(glassGeo, glassMat);
      glassBack.position.set(0, 1.6, -1.55);
      machineGroup.add(glassBack);

      // Glowing internal core
      const coreGeo = new THREE.OctahedronGeometry(0.7, 1);
      const coreMat = new THREE.MeshStandardMaterial({
        color: 0xFF7A2F,
        emissive: 0xFF7A2F,
        emissiveIntensity: 1.4,
        roughness: 0.2
      });
      machineCore = new THREE.Mesh(coreGeo, coreMat);
      machineCore.position.set(0, 1.6, 0);
      machineGroup.add(machineCore);

      // Gyroscopic Cooling Rings around core
      const ringGeo1 = new THREE.TorusGeometry(1.05, 0.04, 8, 32);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x8A9FB4, metalness: 0.8, roughness: 0.2 });
      coolingRing1 = new THREE.Mesh(ringGeo1, ringMat);
      coolingRing1.position.set(0, 1.6, 0);
      machineGroup.add(coolingRing1);

      const ringGeo2 = new THREE.TorusGeometry(1.25, 0.04, 8, 32);
      coolingRing2 = new THREE.Mesh(ringGeo2, ringMat);
      coolingRing2.position.set(0, 1.6, 0);
      coolingRing2.rotation.x = Math.PI / 2;
      machineGroup.add(coolingRing2);

      // Machine Entrance & Exit Portals
      const portalGeo = new THREE.BoxGeometry(0.2, 1.2, 1.4);
      const portalMat = new THREE.MeshStandardMaterial({ color: 0x0A0D14, metalness: 0.9, roughness: 0.1 });
      const portalLeft = new THREE.Mesh(portalGeo, portalMat);
      portalLeft.position.set(-2.1, 1.3, 0);
      machineGroup.add(portalLeft);

      const portalRight = new THREE.Mesh(portalGeo, portalMat);
      portalRight.position.set(2.1, 1.3, 0);
      machineGroup.add(portalRight);

      scene.add(machineGroup);

      // 8. Conveyor Belts (Left Intake & Right Outflow)
      const buildConveyor = (xOffset, isRight) => {
        const group = new THREE.Group();
        // Frame
        const frameGeo = new THREE.BoxGeometry(4.2, 0.25, 1.6);
        const frame = new THREE.Mesh(frameGeo, darkMetalMat);
        frame.position.set(xOffset, 0.65, 0);
        frame.castShadow = true;
        frame.receiveShadow = true;
        group.add(frame);

        // Moving Belt
        const beltGeo = new THREE.BoxGeometry(4.0, 0.06, 1.3);
        const belt = new THREE.Mesh(beltGeo, beltMat);
        belt.position.set(xOffset, 0.8, 0);
        belt.receiveShadow = true;
        group.add(belt);

        // Support Legs
        const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.65, 8);
        [
          [xOffset - 1.6, 0.325, 0.6],
          [xOffset - 1.6, 0.325, -0.6],
          [xOffset + 1.6, 0.325, 0.6],
          [xOffset + 1.6, 0.325, -0.6]
        ].forEach(pos => {
          const leg = new THREE.Mesh(legGeo, darkMetalMat);
          leg.position.set(...pos);
          group.add(leg);
        });

        return group;
      };

      scene.add(buildConveyor(-4.2, false));
      scene.add(buildConveyor(4.2, true));

      // 9. Right Scan Pad
      const scanPadGeo = new THREE.CylinderGeometry(0.9, 1.0, 0.12, 6);
      const scanPadMat = new THREE.MeshStandardMaterial({
        color: 0x181F2C,
        metalness: 0.7,
        roughness: 0.3
      });
      const scanPad = new THREE.Mesh(scanPadGeo, scanPadMat);
      scanPad.position.set(6.2, 0.82, 0);
      scene.add(scanPad);

      // Neon ring on scan pad
      const padRingGeo = new THREE.TorusGeometry(0.75, 0.03, 8, 24);
      padRingGeo.rotateX(Math.PI / 2);
      const padRingMat = new THREE.MeshStandardMaterial({
        color: 0x3DFF8A,
        emissive: 0x3DFF8A,
        emissiveIntensity: 0.6
      });
      const padRing = new THREE.Mesh(padRingGeo, padRingMat);
      padRing.position.set(6.2, 0.9, 0);
      scene.add(padRing);

      // 10. Floating "Complete!" 3D Tag over Scan Pad
      const badgeCanvas = document.createElement('canvas');
      badgeCanvas.width = 256;
      badgeCanvas.height = 100;
      const bCtx = badgeCanvas.getContext('2d');
      bCtx.fillStyle = 'rgba(16, 26, 20, 0.9)';
      bCtx.roundRect ? bCtx.roundRect(8, 8, 240, 84, 18) : bCtx.fillRect(8, 8, 240, 84);
      bCtx.fill();
      bCtx.lineWidth = 4;
      bCtx.strokeStyle = '#3DFF8A';
      bCtx.stroke();
      bCtx.fillStyle = '#3DFF8A';
      bCtx.font = 'bold 28px Inter, sans-serif';
      bCtx.textAlign = 'center';
      bCtx.fillText('✔ OPTIMIZED', 128, 58);

      const badgeTexture = new THREE.CanvasTexture(badgeCanvas);
      const badgeMat = new THREE.SpriteMaterial({ map: badgeTexture, transparent: true, opacity: 0 });
      completeBadgeMesh = new THREE.Sprite(badgeMat);
      completeBadgeMesh.position.set(6.2, 2.3, 0);
      completeBadgeMesh.scale.set(1.9, 0.75, 1);
      scene.add(completeBadgeMesh);

      // 11. Query Blocks
      // Left: Dull Grey Raw Blocks
      const rawBlockGeo = new THREE.BoxGeometry(0.5, 0.35, 0.5);
      const rawBlockMat = new THREE.MeshStandardMaterial({
        color: 0x4B5366,
        roughness: 0.7,
        metalness: 0.2
      });

      for (let i = 0; i < 4; i++) {
        const block = new THREE.Mesh(rawBlockGeo, rawBlockMat);
        block.position.set(-6.0 + i * 1.15, 0.98, 0);
        block.castShadow = true;
        rawBlocks.push(block);
        scene.add(block);
      }

      // Right: Polished / Emerald Query Blocks
      const optBlockGeo = new THREE.BoxGeometry(0.5, 0.35, 0.5);
      const optBlockMat = new THREE.MeshStandardMaterial({
        color: 0x2A3545,
        roughness: 0.15,
        metalness: 0.85
      });

      for (let i = 0; i < 4; i++) {
        const block = new THREE.Mesh(optBlockGeo, optBlockMat.clone());
        block.position.set(2.4 + i * 1.0, 0.98, 0);
        block.castShadow = true;
        optimizedBlocks.push(block);
        scene.add(block);
      }

      // 12. Floating Data Particles
      const particleCount = 65;
      const particleGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 12;
        positions[i * 3 + 1] = Math.random() * 5 + 0.5;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0xFFA055,
        size: 0.12,
        transparent: true,
        opacity: 0.65
      });
      particlesMesh = new THREE.Points(particleGeo, particleMat);
      scene.add(particlesMesh);

      // 13. Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('mousemove', onMouseMove, false);

      // Initialize state
      applyState(currentState);

      // Animation Loop
      animate();
    }

    function onMouseMove(e) {
      if (prefersReducedMotion) return;
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = -(e.clientY / window.innerHeight) * 2 + 1;
      mouseX = nx * 1.8;
      mouseY = ny * 1.2;
    }

    function onWindowResize() {
      const container = document.getElementById('scene-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    // Set state function called externally or from buttons
    window.setRefineryState = function(state) {
      if (state === 'refining') state = 'processing';
      currentState = state;
      applyState(state);
    };

    function applyState(state) {
      document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + (state === 'processing' ? 'processing' : state));
      if (activeBtn) activeBtn.classList.add('active');

      const hudStatus = document.getElementById('hud-status');

      if (state === 'idle') {
        speedFactor = 1.0;
        progressTarget = 20;
        hudStatus.innerText = 'IDLE';
        hudStatus.style.color = '#9BA3B8';
        if (coreLight) coreLight.intensity = 3.0;
        if (scanPadLight) scanPadLight.intensity = 0.2;
        if (completeBadgeMesh) completeBadgeMesh.material.opacity = 0;
        optimizedBlocks.forEach(b => {
          b.material.color.setHex(0x2A3545);
          b.material.emissive.setHex(0x000000);
        });
      } else if (state === 'processing') {
        speedFactor = 3.2;
        progressTarget = 85;
        hudStatus.innerText = 'REFINING...';
        hudStatus.style.color = '#FF7A2F';
        if (coreLight) coreLight.intensity = 5.5;
        if (scanPadLight) scanPadLight.intensity = 0.4;
        if (completeBadgeMesh) completeBadgeMesh.material.opacity = 0;
        optimizedBlocks.forEach(b => {
          b.material.color.setHex(0x354054);
          b.material.emissive.setHex(0x221508);
        });
      } else if (state === 'done') {
        speedFactor = 1.3;
        progressTarget = 100;
        hudStatus.innerText = 'COMPLETE';
        hudStatus.style.color = '#3DFF8A';
        if (coreLight) coreLight.intensity = 3.8;
        if (scanPadLight) scanPadLight.intensity = 3.5;
        if (completeBadgeMesh) completeBadgeMesh.material.opacity = 1.0;
        optimizedBlocks.forEach(b => {
          b.material.color.setHex(0x3DFF8A);
          b.material.emissive.setHex(0x22C55E);
          b.material.emissiveIntensity = 0.85;
        });
      }
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Camera mouse parallax with soft lerp
      targetCameraX = 18 + mouseX;
      targetCameraY = 14 + mouseY;
      if (!prefersReducedMotion) {
        camera.position.x += (targetCameraX - camera.position.x) * 0.04;
        camera.position.y += (targetCameraY - camera.position.y) * 0.04;
        camera.lookAt(0, 1.2, 0);
      }

      // Smooth progress bar lerp
      currentProgress += (progressTarget - currentProgress) * 0.08;
      const pFill = document.getElementById('hud-progress');
      if (pFill) pFill.style.width = currentProgress.toFixed(1) + '%';

      // Core rotation & pulsing
      if (machineCore) {
        machineCore.rotation.y += 0.8 * delta * speedFactor;
        machineCore.rotation.x += 0.4 * delta * speedFactor;
        const pulse = 1 + 0.12 * Math.sin(time * 3 * speedFactor);
        machineCore.scale.set(pulse, pulse, pulse);
      }

      if (coolingRing1) coolingRing1.rotation.z += 0.6 * delta * speedFactor;
      if (coolingRing2) coolingRing2.rotation.y += 0.5 * delta * speedFactor;

      // Conveyor block transport
      const moveStep = delta * 1.5 * speedFactor;

      // Raw blocks moving left -> right into machine portal (-2.0)
      rawBlocks.forEach(b => {
        b.position.x += moveStep;
        if (b.position.x > -2.0) {
          b.position.x = -6.4;
        }
      });

      // Optimized blocks moving out from right portal (2.0) to scan pad (6.2)
      optimizedBlocks.forEach(b => {
        b.position.x += moveStep;
        if (b.position.x > 6.4) {
          b.position.x = 2.1;
        }
      });

      // Subtle float on Complete badge
      if (completeBadgeMesh && completeBadgeMesh.material.opacity > 0) {
        completeBadgeMesh.position.y = 2.3 + Math.sin(time * 3) * 0.08;
      }

      // Data particle drift
      if (particlesMesh && !prefersReducedMotion) {
        const pos = particlesMesh.geometry.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
          pos[i + 1] += 0.012 * speedFactor;
          if (pos[i + 1] > 5.5) pos[i + 1] = 0.5;
        }
        particlesMesh.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
